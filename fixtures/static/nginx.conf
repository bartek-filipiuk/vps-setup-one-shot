server {
    # Both: Coolify's health check calls localhost, which resolves to IPv6 in Alpine images.
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # A static site has no database: "db":"none" is the healthy answer.
    location = /api/health {
        default_type application/json;
        return 200 '{"status":"ok","db":"none"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
