name: starter

on:
  pull_request:
    paths: ['starter/**', 'starter-auth/**', '.github/workflows/starter.yml']
  push:
    branches: [main]
    paths: ['starter/**', 'starter-auth/**', '.github/workflows/starter.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [starter, starter-auth]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - run: npm ci
      - name: unit tests (starter-auth only; fake database, mail to the JSON transport, nothing sent)
        if: matrix.dir == 'starter-auth'
        run: node --version && npm test
      - run: npm run build
